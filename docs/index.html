<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas de IA</title>
  <meta name="description" content="Atlas de IA: fichas de estudio densas, explorables e interactivas sobre matemáticas, machine learning, deep learning, NLP y más.">
  <link rel="stylesheet" href="estilos.css">
  <script>
    try { var t = localStorage.getItem('atlas-ia-tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {}
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script src="vendor/tex-svg-full.js" defer></script>
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-in">
      <a class="marca" href="#inicio">Atlas&nbsp;<span><span class="solo-ancho">de </span>IA</span></a>
      <nav class="nav" aria-label="Secciones">
        <a href="#mapa">Mapa</a>
        <a href="#rutas">Rutas</a>
        <a href="#glosario">Glosario</a>
        <a href="#repaso">Repaso</a>
      </nav>
      <div class="buscador" role="search">
        <label class="oculto-visual" for="buscar">Buscar conceptos y términos</label>
        <input id="buscar" type="search" placeholder="Buscar concepto o término" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="resultados" aria-autocomplete="list">
        <kbd aria-hidden="true">/</kbd>
        <ul id="resultados" class="resultados" role="listbox" hidden></ul>
      </div>
      <button class="boton boton-tema" id="boton-tema" type="button" aria-label="Cambiar tema">◐ Tema</button>
      <button class="boton-icono solo-movil" id="boton-buscar" type="button" aria-label="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>
      <button class="boton-icono solo-movil" id="boton-menu" type="button" aria-label="Más opciones" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </div>
  </header>
  <main id="vista" tabindex="-1"></main>
  <footer class="pie"><p>Atlas de IA · apuntes de <a href="https://github.com/sebamendoza-eusa">sebamendoza-eusa</a> reorganizados en fichas. El progreso se guarda solo en este navegador.</p></footer>
  <nav class="barra-inferior solo-movil" aria-label="Navegación principal">
    <a href="#inicio" data-destino="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Inicio</span></a>
    <a href="#mapa" data-destino="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z"/><path d="M9 4v14M15 6v14"/></svg><span>Mapa</span></a>
    <a href="#rutas" data-destino="rutas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M8.3 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.7"/></svg><span>Rutas</span></a>
    <a href="#glosario" data-destino="glosario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16V4.5Z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19M9 8.5h6"/></svg><span>Glosario</span></a>
    <a href="#repaso" data-destino="repaso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5v4.5h-4.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Repaso</span></a>
  </nav>

  <script src="datos/indice.js"></script>
  <script src="motores/nucleo.js"></script>
  <script src="mapa.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
